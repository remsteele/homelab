schema_version: 1
bridges:
  - id: vmbr0
    status: confirmed
    host: pve
    role: WAN bridge
    ports: [enp3s0f0]
    vlan_aware: false
    host_addressing: none
    constraints:
      - The Proxmox host must not have an IP or default gateway on this bridge.
  - id: vmbr1
    status: confirmed
    host: pve
    role: LAN VLAN trunk
    ports: [enp3s0f1]
    vlan_aware: true
    allowed_vlan_ids: 2-4094
  - id: vmbr1.10
    status: confirmed
    host: pve
    parent: vmbr1
    vlan_id: 10
    address: 10.0.10.2/24
    default_gateway: 10.0.10.1

vlans:
  - id: home
    status: confirmed
    vlan_id: 10
    name: HOME
    subnet: 10.0.10.0/24
    gateway: 10.0.10.1
    trust: trusted
    roles: [trusted-clients, infrastructure-management, reverse-proxy]
  - id: iot
    status: confirmed
    vlan_id: 20
    name: IOT
    subnet: 10.0.20.0/24
    gateway: 10.0.20.1
    trust: untrusted
  - id: guest
    status: confirmed
    vlan_id: 30
    name: GUEST
    subnet: 10.0.30.0/24
    gateway: 10.0.30.1
    trust: untrusted
  - id: servers
    status: confirmed
    vlan_id: 40
    name: SERVERS
    subnet: 10.0.40.0/24
    gateway: 10.0.40.1
    trust: restricted
    roles: [internal-services, media-stack]
  - id: dmz
    status: confirmed
    vlan_id: 50
    name: DMZ
    subnet: 10.0.50.0/24
    gateway: 10.0.50.1
    trust: restricted
    roles: [publicly-exposed-workloads]
  - id: tor
    status: planned
    vlan_id: 60
    name: TOR
    subnet: 10.0.60.0/24
    gateway: needs_verification
    trust: untrusted
    roles: [transparent-tor-wifi]
  - id: mgmt
    status: planned
    vlan_id: 99
    name: MGMT
    subnet: needs_verification
    gateway: needs_verification
    note: Management currently remains on VLAN 10.

wifi:
  access_point: eap650
  management_vlan: home
  ssids:
    - name: HOME
      status: confirmed
      vlan: home
    - name: IOT
      status: confirmed
      vlan: iot
    - name: GUEST
      status: confirmed
      vlan: guest
      client_isolation: needs_verification
    - name: Tor / Tor-WiFi
      status: planned
      vlan: tor

special_routes:
  - id: qbittorrent-home-return
    status: confirmed
    host: qbittorrent
    destination: 10.0.10.0/24
    via: 10.0.40.1
    interface: eth0
    configured_in: /etc/wireguard/proton.conf
    purpose: Return HOME/Caddy traffic over LAN instead of Proton policy routing.
    commands:
      post_up: ip route replace 10.0.10.0/24 via 10.0.40.1 dev eth0
      post_down: ip route del 10.0.10.0/24 via 10.0.40.1 dev eth0 2>/dev/null || true

untagged_networks:
  - id: legacy-opnsense-lan
    status: confirmed
    interface: router/vtnet1
    subnet: 192.168.1.0/24
    gateway: 192.168.1.1
    ipv6_prefix: "2600:8801:8e00:1cf::/64"
    router_ipv6: "2600:8801:8e00:1cf:be24:11ff:fe74:83af"
    dhcp_range: 192.168.1.100-192.168.1.199
    ipv6_router_advertisements: enabled
    verified_as_of: "2026-11-01"
    note: This temporary pre-VLAN LAN is still active on the same parent interface that carries the VLAN trunk.

wan_observations:
  - status: historical
    observed_as_of: "2026-11-01"
    interface: router/vtnet0
    ipv4: 70.179.13.243/22
    ipv4_gateway: 70.179.12.1
    ipv6: "2600:8801:ff00:e00:8b0:e5f1:5790:6fdc/128"
    warning: Point-in-time dynamic Cox addresses; do not use as desired fixed state.

historical_networks:
  - status: historical
    address: 192.168.0.231
    host: games
    purpose: Temporary pre-OPNsense address on untagged vmbr0

