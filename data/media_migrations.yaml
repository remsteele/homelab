schema_version: 1
purpose: Historical recovery evidence for torrents whose data was manually renamed or moved.
general_method:
  status: confirmed
  steps:
    - Stop Sonarr or Radarr when it could race with the repair.
    - Use qBittorrent Set Location to relocate data into the correct category path.
    - Recreate the library view with hardlinks where needed.
    - Verify matching device, inode, and link count.
    - Assign the correct qBittorrent category and force a recheck.
    - Restart the Arr service and ensure later renames preserve links.

