media_bind:
  status: confirmed
  host_root: /mnt/media
  container_root: /media
  consumers:
    - {host: jellyfin, access: read-write-current, desired_access: read-only-possible}
    - {host: qbittorrent, access: read-write}
    - {host: sonarr, access: read-write}
    - {host: radarr, access: read-write}
  non_consumers:
    - caddy
    - prowlarr
    - dvdstream
  design:
    - All download and library paths share one filesystem.
    - Hardlinks and atomic moves are supported.
    - Do not split downloads and libraries into unrelated mounts if hardlinks are desired.
    - Do not use mode 777.

layout:
  - {path: /mnt/media/downloads/incomplete/Movies, role: incomplete movie downloads}
  - {path: /mnt/media/downloads/incomplete/TV, role: incomplete TV downloads}
  - {path: /mnt/media/downloads/movies, role: completed movie seeding source}
  - {path: /mnt/media/downloads/tv, role: completed TV seeding source}
  - {path: /mnt/media/movies, role: Radarr movie library and Jellyfin source}
  - {path: /mnt/media/tv, role: Sonarr TV library and Jellyfin source}

permissions:
  status: confirmed
  container_group: {name: media, gid: 5000}
  host_mapped_gid: 105000
  id_mapping:
    container_uid_0_to_host: 100000
    container_gid_0_to_host: 100000
    range: 65536
  writable_members:
    - qbittorrent
    - sonarr
    - radarr
  excluded_members:
    - {service: jellyfin, reason: Least privilege; reads through normal read bits}
  conventions:
    directory_mode: "2775"
    file_mode: "0664"
    service_umask: "0002"
    root_path_note: /media itself appears as 65534:65534 inside unprivileged containers but is mode 755 and traversable.

