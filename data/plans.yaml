schema_version: 1
plans:
  - id: opnsense-api-access
    status: proposed
    goal: Give the homelab agent narrowly scoped, auditable OPNsense machine access without administrator or privileged SSH credentials.
    installed_capability:
      version: OPNsense 26.7.5
      authentication: Per-user API key and one-time-download secret over HTTP Basic authentication
      verified_modules: [dnsmasq, unbound, firewall-filter]
    recommended_phase_one:
      account: homelab-agent
      group: homelab-api-dns
      source_network: Fixed MacBook HOME address /32
      privileges: ["Services: Dnsmasq DNS/DHCP: Settings"]
      shell: /sbin/nologin
      ordinary_password_login: scrambled-disabled
      credential_storage: macOS Keychain outside this repository
    limitations:
      - Dnsmasq and modern firewall ACLs combine read and write endpoints; they are not technically read-only.
      - Applying Unbound overrides requires the broad Services: Unbound API scope on the installed ACL.
      - The modern firewall API must not be assumed to manage legacy rules.
    expansion_gate: Add Unbound or Firewall Rules [new] privileges only after accepting their wider mutation scope.
    runbook: runbooks/opnsense-api.md

  - id: adguard-network-rollout
    status: planned
    goal: Move client DNS to the deployed AdGuard Home resolver without breaking segmentation or qBittorrent's fail-closed policy.
    deployed_foundation:
      - CT 109 at 10.0.10.4 is running AdGuard Home v0.107.79.
      - Caddy serves https://adguard.home.rvsteele.com and proxies to 10.0.10.4:80.
      - Public, local, filtered, reboot-persistence, and HTTPS tests pass.
    remaining:
      - Add adguard.home.rvsteele.com -> 10.0.10.3 to OPNsense Unbound.
      - Add TCP/UDP 53 passes to 10.0.10.4 above LOCAL_NETS blocks on IOT, GUEST, SERVERS, and DMZ.
      - Set DHCP DNS to 10.0.10.4 one VLAN at a time and renew test clients.
      - Keep qBittorrent on OPNsense DNS until its host-specific rule is deliberately changed and leak-tested.
      - Decide whether DNS high availability is worth a second filtering resolver.

  - id: dvd-watch-now
    status: planned
    goal: Select a physical DVD title in a local web UI and stream it to the LG C3.
    sequence:
      - Repair and verify the physical optical SATA path.
      - Build title discovery and HLS session management in CT 108.
      - Prefer stream-copy MPEG-2/AC3 HLS if LG C3 compatibility is acceptable.
      - Assign an internal application port.
      - Add dvd.home.rvsteele.com to Unbound pointing at Caddy.
      - Add Caddy reverse proxy to 10.0.40.15 on the selected port.
      - Test start, stop, concurrent-session, eject, and disc-removal behavior.
    optional_future: Rip selected movies/episodes into Jellyfin libraries.

  - id: tor-wifi
    status: planned
    goal: Dedicated fail-closed transparent Tor SSID on VLAN 60.
    architecture: EAP650 VLAN 60 -> dedicated Debian Tor gateway -> Tor -> Internet
    requirements:
      - TCP routed through Tor
      - DNS routed through Tor
      - No direct-WAN fallback
      - IPv6 disabled initially
      - Unsupported UDP blocked
      - Tor failure means no Internet
    caveat: Tor Browser remains recommended for fingerprint/cookie/isolation protection.

  - id: management-vlan
    status: planned
    vlan_id: 99
    note: No subnet or migration design is confirmed; management remains on VLAN 10.

  - id: homelab-agent
    status: planned
    name: OpenClaw
    placement: Dedicated Debian VM, probably HOME/management VLAN
    access:
      - Broad read-only topology, configuration, API, and log visibility
      - Read-only APIs where possible
      - Approval-gated privileged path
      - No unrestricted root SSH everywhere
    change_workflow:
      - Propose exact diff
      - Ask permission
      - Apply narrowly
      - Verify
      - Record in Git and snapshots

  - id: jellyfin-read-only-media
    status: proposed
    goal: Convert Jellyfin media bind to read-only if feature operation remains correct.

  - id: home-firewall-tightening
    status: planned
    goal: Replace TEMP HOME allow-all with least-privilege management/client policy.

  - id: selected-4k-profile
    status: proposed
    goal: Add a separate 4K profile for selected content without making 4K the default.

