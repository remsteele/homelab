client_dns_distribution:
  status: confirmed
  current: OPNsense DHCP still distributes the firewall/resolver address for each VLAN; the network-wide AdGuard cutover has not been applied.
  desired_after_rollout: Distribute only 10.0.10.4 when AdGuard availability and per-VLAN firewall rules are accepted.
  availability_warning: A single AdGuard instance is a DNS single point of failure; adding 10.0.10.1 as a secondary lets clients bypass filtering.

public_records:
  - name: terraria.rvsteele.com
    type: A
    value: dynamic-wan-ipv4
    proxy: false
    status: confirmed
    managed_by: OPNsense os-ddclient
    note: Do not delete; DDNS updates the existing record.
    current_observation:
      observed_as_of: "2026-11-01"
      value: 70.179.13.243
      matches_live_wan: true

dynamic_dns:
  - id: terraria-cloudflare
    status: confirmed
    client: OPNsense os-ddclient
    backend: native
    provider: Cloudflare
    interface: WAN
    address_family: IPv4
    zone: rvsteele.com
    hostname: terraria.rvsteele.com
    credential_field: OPNsense password field contains a scoped API token; value is excluded.
    username_field: blank
    required_scope:
      - "Zone / DNS / Edit on rvsteele.com"

historical_observations:
  - status: historical
    observed_as_of: "2026-11-01"
    record: Cox WAN IPv4 was 70.179.13.243
    warning: Dynamic observation; never treat as a fixed address.
  - status: historical
    record: Cox WAN IPv4 was 98.176.159.214
    warning: Dynamic observation; never treat as a fixed address.
  - status: historical
    host: qbittorrent
    stale_nameserver: 192.168.0.1
    corrected_nameserver: 10.0.40.1
    impact: Name resolution failed through the otherwise healthy Proton tunnel after WAN disable/recovery.

