schema_version: 1
architecture:
  status: confirmed
  dhcp_server:
    implementation: OPNsense Dnsmasq
    domain: internal
    reservation_behavior: Reservations generate Dnsmasq host entries on port 53053, but the Caddy-facing names still require independent Unbound overrides on port 53.
  resolver:
    implementation: OPNsense Unbound
    listen_port: 53
    role: Local authoritative source for home.rvsteele.com and current client resolver during the staged AdGuard rollout.
  filtering_resolver:
    implementation: AdGuard Home v0.107.79
    address: 10.0.10.4
    listen_port: 53
    public_upstream: https://cloudflare-dns.com/dns-query
    local_domain_upstream: 10.0.10.1
    private_ptr_upstream: 10.0.10.1
    client_rollout: staged-not-yet-distributed-by-dhcp
  dnsmasq_dns:
    listen_port: 53053
  internal_record_policy: Create static names in Unbound DNS Host Overrides.

dhcp_pools:
  - {vlan: home, start: 10.0.10.100, end: 10.0.10.199, status: confirmed}
  - {vlan: iot, start: 10.0.20.100, end: 10.0.20.199, status: confirmed}
  - {vlan: guest, start: 10.0.30.100, end: 10.0.30.199, status: confirmed}
  - {vlan: servers, start: 10.0.40.100, end: 10.0.40.199, status: confirmed}
  - {vlan: dmz, start: 10.0.50.100, end: 10.0.50.199, status: confirmed}

untagged_dhcp_pools:
  - {network: legacy-opnsense-lan, subnet: 192.168.1.0/24, start: 192.168.1.100, end: 192.168.1.199, status: confirmed}

