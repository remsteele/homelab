  verified_as_of: "2026-11-02"
  records:
    - {name: adguard.home.rvsteele.com, type: A, value: 10.0.10.3, purpose: Resolve the UI through Caddy for clients using AdGuard}
    - {name: homepage.home.rvsteele.com, type: A, value: 10.0.10.3, purpose: Resolve the UI through Caddy for clients using AdGuard}
    - {name: uptime.home.rvsteele.com, type: A, value: 10.0.10.3, purpose: Resolve the UI through Caddy for clients using AdGuard}
