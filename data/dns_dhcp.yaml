schema_version: 1
architecture:
  status: confirmed
  dhcp_server:
    implementation: OPNsense Dnsmasq
    reservation_behavior: Reservations do not automatically imply the required Unbound host override.
  resolver:
    implementation: OPNsense Unbound
    listen_port: 53
  dnsmasq_dns:
    listen_port: 53053
  internal_record_policy: Create static names in Unbound DNS Host Overrides.

