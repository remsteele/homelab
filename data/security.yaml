schema_version: 1
principles:
  - id: no-secrets-in-repository
    status: confirmed
    rule: Never commit credentials, private keys, recovery codes, or session material.
  - id: least-privilege
    status: confirmed
    examples:
      - Jellyfin is not in the writable media group.
      - FlareSolverr binds only to loopback.
      - dvdstream has no media-disk mount.
      - WAN management interfaces are not intentionally exposed.
  - id: management-agent-safety
    status: confirmed
    rule: Broad OPNsense API visibility, exact proposed diffs, explicit user authorization before writes, verification after changes, and an audit record.

secret_locations:
  - id: opnsense-agent-api-keypair
    status: confirmed
    host: user-mac
    location: macOS Keychain generic passwords
    service_names: [homelab-opnsense-api-key, homelab-opnsense-api-secret]
    account: homelab-api
    purpose: Full WebCfg read/write OPNsense API access from the owner's MacBook
    granted_scope: ["WebCfg - All pages"]
    source_network_constraint: 10.0.10.194/32
    source_mac: "56:fa:43:ce:40:23"
    opnsense_identity: {user: homelab-api, group: homelab-api-access, shell: /sbin/nologin, ordinary_password: scrambled}
    tls_certificate: {path: ~/.config/opnsense/OPNsense.internal.pem, verification: pinned, expires: "2027-11-01"}
    provisioned_and_tested_as_of: "2026-11-02"
    rotation: Generate a replacement key, test GET access, then revoke the old key in OPNsense.
    value_policy: excluded; never store either value in Git, snapshots, chat, or shell scripts
  - id: caddy-cloudflare-token
    status: confirmed
    host: caddy
    path: /etc/caddy/cloudflare_token
    purpose: Cloudflare DNS-01 certificate challenges
    expected_owner: root:caddy
    expected_mode: "0640"
    required_scope:
      - "Zone / DNS / Edit on rvsteele.com"
      - "Zone / Zone / Read on rvsteele.com"
    value_policy: excluded
  - id: opnsense-ddns-cloudflare-token
    status: confirmed
    host: router
    location: OPNsense os-ddclient credential store
    purpose: Update terraria.rvsteele.com A record
    required_scope:
      - "Zone / DNS / Edit on rvsteele.com"
    value_policy: excluded
  - id: proton-wireguard-private-key
    status: confirmed
    host: qbittorrent
    path: /etc/wireguard/proton.conf
    purpose: ProtonVPN tunnel authentication
    value_policy: excluded
  - id: homelab-ssh-private-key
    status: confirmed
    host: user-mac
    path: ~/.ssh/homelab_ed25519
    public_key_path: ~/.ssh/homelab_ed25519.pub
    key_type: Ed25519
    comment: homelab
    fingerprint: SHA256:KxOez4FB3HfcyKBI5GHXEHuhyqrP8LPxbX2NESIgdF0
    created_or_modified: "2026-11-01"
    storage: macOS Keychain
    value_policy: The private key remains on the MacBook and outside this repository; only the public key is installed remotely.
  - id: adguard-admin-password
    status: confirmed
    host: user-mac
    location: macOS Keychain generic password
    service_name: adguard.home.rvsteele.com
    account: remington
    purpose: AdGuard Home web administration
    remote_storage: AdGuard stores only its password hash in /opt/AdGuardHome/AdGuardHome.yaml.
    value_policy: excluded
  - id: homepage-authentication
    status: confirmed
    host: user-mac
    location: macOS Keychain generic passwords
    service_names: [homepage.home.rvsteele.com, homepage-auth-secret]
    accounts: [remington, homepage]
    purpose: Homepage login password and server-side authentication secret
    remote_storage: Values are supplied to the container from /opt/homepage/.env, mode 0600; the repository contains neither value.
    value_policy: excluded
  - id: uptime-kuma-admin-password
    status: confirmed
    host: user-mac
    location: macOS Keychain generic password
    service_name: uptime.home.rvsteele.com
    account: remington
    purpose: Uptime Kuma web administration
    remote_storage: Uptime Kuma stores a password hash in its local SQLite database.
    value_policy: excluded
  - id: seerr-application-secrets
    status: confirmed
    host: seerr
    path: /opt/seerr/config/settings.json
    purpose: Seerr API key and Jellyfin, Sonarr, and Radarr integration credentials
    remote_storage: Docker bind-mounts the directory at /app/config; it remains only on CT 112's local root disk.
    value_policy: excluded; never copy settings.json into Git or a snapshot
  - id: terraria-server-secret
    status: confirmed
    host: games
    path: /opt/terraria/serverconfig.txt
    purpose: Terraria client access
    value_policy: excluded

ssh_policy:
  status: confirmed
  preferred_authentication: Ed25519 public key
  shared_key_pair:
    private_key_location: ~/.ssh/homelab_ed25519 on the owner's MacBook
    public_key_location: ~/.ssh/homelab_ed25519.pub on the owner's MacBook
    client_config: ~/.ssh/config with direct-IP short-name and web-FQDN aliases; mode 0600
    public_key_fingerprint: SHA256:KxOez4FB3HfcyKBI5GHXEHuhyqrP8LPxbX2NESIgdF0
    private_key_remote_copy: prohibited
    verified_as_of: "2026-11-01"
  password_policy: Unique randomized 18+ character value per host, stored only in a password manager
  root_login: Disable where practical
  admin_user: remington where practical
  sudo: Password required by default; no blanket NOPASSWD
  confirmed_hosts:
    - {host: router, user: remington, key_auth: needs_verification, advertised_auth_methods: publickey-only, root_login: user-confirmed-disabled, password_login: confirmed-disabled, last_test: "Documented Ed25519 key rejected on 2026-11-02"}
    - {host: pve, user: root, key_auth: confirmed, permit_root_login: true, password_authentication: true, hardening: required}
    - {host: caddy, user: root, key_auth: confirmed, permit_root_login: publickey-only, password_authentication_for_other_users: true}
    - {host: jellyfin, user: root, key_auth: confirmed, permit_root_login: publickey-only, password_authentication_for_other_users: true}
    - {host: qbittorrent, user: root, key_auth: confirmed, permit_root_login: publickey-only, password_authentication_for_other_users: true}
    - {host: sonarr, user: root, key_auth: confirmed, permit_root_login: publickey-only, password_authentication_for_other_users: true}
    - {host: radarr, user: root, key_auth: confirmed, permit_root_login: publickey-only, password_authentication_for_other_users: true}
    - {host: prowlarr, user: root, key_auth: confirmed, permit_root_login: publickey-only, password_authentication_for_other_users: true}
    - {host: adguard, user: root, key_auth: confirmed, permit_root_login: publickey-only, password_authentication_for_other_users: true}
    - {host: homepage, user: root, key_auth: confirmed, permit_root_login: publickey-only, password_authentication_for_other_users: true, host_key_fingerprint: "SHA256:nnaSK+7YGKfY52KquTOigj6PukIrN8hX52YgpjakpiA"}
    - {host: uptime-kuma, user: root, key_auth: confirmed, permit_root_login: publickey-only, password_authentication_for_other_users: true, host_key_fingerprint: "SHA256:nU7Lr2UvyOO+22avu2aD3tHJrgfadApwGhx/p4gjzO0"}
    - {host: seerr, user: root, key_auth: confirmed, permit_root_login: publickey-only, password_authentication_for_other_users: true, host_key_fingerprint: "SHA256:/MY9irHZr8wBuSD5WdJt384wz89n1cuJGyYzm/GX1GM"}
    - {host: games, user: remington, key_auth: confirmed, advertised_auth_methods: "publickey,password"}
    - {host: lg-c3, user: root, key_auth: needs_verification, advertised_auth_methods: "publickey,password", server: dropbear_2022.83, client_alias: tv, warning: Telnet TCP 23 also listens unencrypted}
    - {host: dvdstream, user: root, key_auth: user-reported, verification: unavailable-while-powered-off}
  not_ssh_managed:
    - {host: eap650, result: TCP 22 connection refused}
  additional_keys:
    - host: pve
      account: root
      fingerprint: SHA256:esvLKmQ2OSD+SuU4VnG9PiR9ePG7Y8ojdA15/u/znUs
      type: RSA-4096
      comment: root@pve
      status: needs_verification
      action: Confirm ownership and continued need.
  audit_remaining: CT 108 effective SSH policy and Games effective daemon settings require local privileged inspection.

service_exposure:
  public:
    - {service: terraria, protocol: TCP, port: 7777, protection: DMZ isolation}
  internal_only:
    - opnsense-webgui
    - proxmox-webgui
    - eap-webui
    - jellyfin
    - qbittorrent
    - sonarr
    - radarr
    - prowlarr
    - adguard-home
    - homepage
    - uptime-kuma
    - seerr
    - flaresolverr
    - dvd-watch-now

vpn_safety:
  status: confirmed
  service: qbittorrent
  layers:
    - qBittorrent network-interface binding to proton
    - systemd dependency on wg-quick@proton
    - OPNsense host-specific endpoint allow and default block
  deliberate_failure_test: needs_verification
  constraint: Do not weaken the kill switch to solve boot ordering.

