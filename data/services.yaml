  - id: proton-wireguard
    status: confirmed
    host: qbittorrent
    role: Full-tunnel VPN and qBittorrent transport
    interface: proton
    systemd_unit: wg-quick@proton.service
    config_path: /etc/wireguard/proton.conf
    allowed_ips: [0.0.0.0/0, "::/0"]
    endpoint:
      value: "146.70.195.82:51820"
      status: confirmed
      verified_as_of: "2026-11-01"
      note: Observed endpoint; may change with provider configuration.
    observed_addresses:
      - 10.2.0.2/32
      - "2a07:b944::2:2/128"
    persistent_keepalive_seconds: 25
    observed_health:
      status: historical
      handshake_age: approximately 1-2 minutes
      received_gib: 85.03
      sent_gib: 28.95
    kill_switch_layers:
      - qBittorrent is bound to interface proton.
      - OPNsense permits CT 102 only DNS and UDP 51820 to PROTON_ENDPOINT, then blocks all other egress.
      - qBittorrent depends on the WireGuard systemd unit.
    boot_issue: wg-quick can run before DHCP makes 10.0.40.1 a valid next hop; its PostUp route then fails fatally.
    runtime_as_of_2026_11_01:
      systemd_enabled: true
      active: true
      latest_handshake_age: approximately 1 minute 23 seconds
      received_gib: 57.17
      sent_gib: 25.73
      note: Counters and handshake age are ephemeral evidence, not desired configuration.

